<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 工单数据分析系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: white; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.login-card h1 { text-align: center; color: #1a1a2e; margin-bottom: 8px; font-size: 24px; }
.login-card .subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
.form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
.form-group input:focus { outline: none; border-color: #0f3460; }
.btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(15,52,96,0.4); }
.btn:active { transform: translateY(0); }
.error { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; text-align: center; }
.hint { text-align: center; margin-top: 20px; color: #999; font-size: 13px; }
.hint code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="login-card">
  <h1>工单数据分析系统</h1>
  <p class="subtitle">异常检测 · 风险评分 · 库存预测</p>
  <form id="loginForm">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn">登 录</button>
    <div class="error" id="error"></div>
  </form>
  <div class="hint">默认账户: <code>admin</code> / <code>admin123</code></div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');

  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await resp.json();
    if (!resp.ok) {
      errorEl.textContent = data.detail || '登录失败';
      errorEl.style.display = 'block';
      return;
    }
    // 保存token到cookie
    document.cookie = `access_token=${data.access_token}; path=/; max-age=86400`;
    window.location.href = '/dashboard';
  } catch (err) {
    errorEl.textContent = '网络错误，请重试';
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
